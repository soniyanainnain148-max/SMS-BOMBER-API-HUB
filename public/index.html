<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMSBomb · key generator</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#05070c;--panel:#0a1018;--line:#132033;--line2:#1b2c45;--fg:#e6eefb;--dim:#7e93ad;--accent:#2f9bff;--accent2:#22e0ff;--bad:#ff5c7a}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:radial-gradient(900px 500px at 50% -12%,rgba(47,155,255,.16),transparent 70%),var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;line-height:1.6}
  .mono{font-family:'JetBrains Mono',monospace}
  .wrap{max-width:780px;margin:0 auto;padding:0 20px}
  a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
  header{border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .brand{font-weight:700;color:var(--accent2);text-shadow:0 0 18px rgba(34,224,255,.5)}
  .brand span{font-size:11px;color:var(--dim);font-weight:400;text-shadow:none}
  h1{font-size:clamp(26px,5vw,36px);letter-spacing:-.035em;margin:42px 0 8px;line-height:1.1}
  h1 .soft{color:var(--dim)}
  .lede{color:var(--dim);margin:0 0 26px;font-size:14px}
  section{padding:34px 0;border-top:1px solid var(--line)}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin:0 0 14px;font-weight:500}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .panel.glow{border-color:var(--line2);box-shadow:0 0 0 1px rgba(47,155,255,.14),0 0 40px rgba(47,155,255,.09)}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
  input{width:100%;background:#050a12;border:1px solid var(--line2);color:var(--fg);border-radius:8px;padding:11px 12px;font-size:14px;font-family:'JetBrains Mono',monospace}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,155,255,.18)}
  .g3{display:grid;grid-template-columns:1fr 130px 140px;gap:12px;margin-bottom:16px}
  @media(max-width:640px){.g3{grid-template-columns:1fr}}
  button{background:linear-gradient(180deg,var(--accent),#1f7fe0);color:#fff;border:0;border-radius:8px;padding:12px 20px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;box-shadow:0 0 22px rgba(47,155,255,.3)}
  button:disabled{opacity:.5}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2);font-weight:500;box-shadow:none;padding:8px 14px;font-size:12px}
  button.red{background:transparent;color:var(--bad);border:1px solid #3d2030;font-weight:500;padding:5px 10px;font-size:11px;box-shadow:none}
  .box{display:none;margin-top:16px;border:1px dashed var(--line2);border-radius:10px;padding:14px;background:#050a12}
  .k{font-family:'JetBrains Mono',monospace;font-size:12px;word-break:break-all;color:var(--accent2);text-shadow:0 0 14px rgba(34,224,255,.45)}
  .err{color:var(--bad);font-size:12px;margin-top:10px}
  .note{color:var(--dim);font-size:12px;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:6px;border-bottom:1px solid var(--line)}
  td{padding:7px 6px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace}
  td.dim{color:var(--dim)}
  .svc{display:flex;justify-content:space-between;font-size:12px;font-family:'JetBrains Mono',monospace;padding:4px 0;border-bottom:1px solid var(--line)}
  .svc .live{color:var(--accent2)}.svc .dead{color:var(--dim)}
  footer{padding:30px 0 50px;border-top:1px solid var(--line);color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">SMSBomb <span class="mono">/ key generator</span></div>
  <a href="#keys" class="mono" style="font-size:12px;color:var(--dim)">admin</a>
</div></header>

<main class="wrap">
  <h1>Key banao.<br><span class="soft">URL ready milega.</span></h1>
  <p class="lede">Naam, kitne din, per day limit — generate dabao. Key ke saath poora URL milega, browser me seedha kholega.</p>

  <section style="border-top:0;padding-top:0">
    <div class="panel glow">
      <div class="g3">
        <div><label>naam</label><input id="name" placeholder="kiske liye" autocomplete="off"></div>
        <div><label>expire (din)</label><input id="days" value="1" inputmode="decimal" step="0.5"></div>
        <div><label>per day limit</label><input id="daily" value="100" inputmode="numeric"></div>
      </div>
      <div style="margin-bottom:16px">
        <label>number (url me lag jayega)</label>
        <input id="num" placeholder="9876543210" inputmode="numeric">
      </div>
      <button id="gen">generate key</button>

      <div class="box" id="box">
        <label>key</label>
        <div class="k" id="outkey"></div>
        <div class="note" id="meta"></div>

        <label style="margin-top:16px">bomb url — browser me kholo</label>
        <div class="k" id="outurl"></div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="ghost" id="c1">copy</button>
          <button class="ghost" id="o1">kholo</button>
        </div>

        <label style="margin-top:16px">health url — services check</label>
        <div class="k" id="outhurl"></div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="ghost" id="c2">copy</button>
          <button class="ghost" id="o2">kholo</button>
        </div>
      </div>
      <div class="err" id="err"></div>
    </div>
  </section>

  <section>
    <h2>Services <span class="mono" id="svcTotal" style="color:var(--dim)"></span></h2>
    <div class="panel" id="svclist" style="max-height:260px;overflow:auto"><span class="note">load ho raha...</span></div>
  </section>

  <section id="keys">
    <h2>Admin · keys</h2>
    <div class="panel">
      <div class="g3" style="grid-template-columns:1fr 130px;margin-bottom:12px">
        <div><label>admin secret</label><input id="sec" type="password" placeholder="ADMIN_SECRET" autocomplete="off"></div>
        <div style="display:flex;align-items:end"><button class="ghost" id="load">load</button></div>
      </div>
      <div id="list" class="note">secret daalo, phir load</div>
      <div class="err" id="e2"></div>
    </div>
  </section>
</main>

<footer><div class="wrap">SMSBomb API Hub</div></footer>

<script>
const $ = (i) => document.getElementById(i);
const enc = encodeURIComponent;

async function boot(){
  try{
    const j = await (await fetch('/api/v1/services')).json();
    const list = $('svclist'); list.innerHTML = '';
    (j.services || []).forEach(s => {
      const row = document.createElement('div');
      row.className = 'svc';
      row.innerHTML = `<span>${s.name}</span><span class="${s.live?'live':'dead'}">${s.live?'live':'down'}</span>`;
      list.appendChild(row);
    });
    $('svcTotal').textContent = `${j.live}/${j.total} live`;
  }catch(e){}
}

$('gen').onclick = async () => {
  $('err').textContent = '';
  const name = $('name').value.trim();
  const days = parseFloat($('days').value) || 1;
  const daily = parseInt($('daily').value, 10) || 100;
  const num = $('num').value.replace(/\D/g, '');

  const b = $('gen'); b.disabled = true; b.textContent = 'bana raha...';
  try{
    const r = await fetch('/api/v1/keys', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ name, hours: days * 24, daily, number: num, plan: '1d' })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'fail');

    const bomb = `${location.origin}/api/v1/bomb?key=${enc(j.key)}&number=${num}`;
    const hlth = `${location.origin}/api/v1/health?key=${enc(j.key)}&number=${num}`;

    $('outkey').textContent = j.key;
    $('outurl').textContent = bomb;
    $('outhurl').textContent = hlth;
    $('meta').textContent = `${j.daily || daily} calls/din · expire: ${new Date(j.expires).toLocaleString()}`;
    $('box').style.display = 'block';

    $('c1').onclick = () => { navigator.clipboard.writeText(bomb); $('meta').textContent = 'copy ho gaya.'; };
    $('o1').onclick = () => window.open(bomb, '_blank');
    $('c2').onclick = () => { navigator.clipboard.writeText(hlth); $('meta').textContent = 'copy ho gaya.'; };
    $('o2').onclick = () => window.open(hlth, '_blank');
  }catch(e){ $('err').textContent = e.message; }
  b.disabled = false; b.textContent = 'generate key';
};

const left = (ts) => {
  if (!ts) return 'never';
  const d = ts - Date.now();
  if (d <= 0) return 'expired';
  const h = Math.floor(d / 36e5);
  return h > 24 ? Math.floor(h/24) + 'd' : (h || Math.floor(d/6e4) + 'm');
};

$('load').onclick = async () => {
  $('e2').textContent = '';
  const s = $('sec').value.trim();
  const r = await fetch('/api/admin/keys?secret=' + enc(s));
  const j = await r.json();
  if (!j.ok) return $('e2').textContent = j.error;
  if (!j.keys.length) return $('list').textContent = 'koi key nahi';
  $('list').innerHTML = `<table><tr><th>name</th><th>key</th><th>din</th><th>aaj/limit</th><th>total</th><th></th></tr>
    ${j.keys.map(k => `<tr>
      <td>${k.name || '-'}</td>
      <td class="dim">${k.key}</td>
      <td class="${left(k.expires)==='expired'?'dim':''}">${left(k.expires)}</td>
      <td class="dim">${k.used}/${k.daily}</td>
      <td class="dim">${k.total}</td>
      <td><button class="red" data-k="${k.key}">kill</button></td></tr>`).join('')}</table>`;
  $('list').querySelectorAll('button[data-k]').forEach(x => {
    x.onclick = async () => {
      if (!confirm('revoke?')) return;
      await fetch(`/api/admin/keys?secret=${enc(s)}&key=${enc(x.dataset.k)}`, { method:'DELETE' });
      $('load').click();
    };
  });
};

$('sec').value = localStorage.getItem('sb_sec') || '';
$('sec').onchange = () => localStorage.setItem('sb_sec', $('sec').value.trim());
boot();
</script>
</body>
</html>
