<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — SMSBomb</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#05070c;--panel:#0a1018;--line:#132033;--line2:#1b2c45;--fg:#e6eefb;--dim:#7e93ad;--accent:#2f9bff;--accent2:#22e0ff;--bad:#ff5c7a}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:radial-gradient(900px 460px at 50% -10%,rgba(47,155,255,.14),transparent 70%),var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;line-height:1.6}
  .mono{font-family:'JetBrains Mono',monospace}
  .wrap{max-width:860px;margin:0 auto;padding:0 20px}
  a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
  header{border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .brand{font-weight:700;color:var(--accent2);text-shadow:0 0 18px rgba(34,224,255,.5)}
  .brand span{font-size:11px;color:var(--dim);font-weight:400;text-shadow:none}
  h1{font-size:24px;letter-spacing:-.03em;margin:34px 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 22px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin:30px 0 12px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
  input,select{width:100%;background:#050a12;border:1px solid var(--line2);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:14px;font-family:'JetBrains Mono',monospace}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,155,255,.18)}
  button{background:linear-gradient(180deg,var(--accent),#1f7fe0);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 0 20px rgba(47,155,255,.28)}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2);font-weight:500;box-shadow:none}
  button.red{background:transparent;color:var(--bad);border:1px solid #3d2030;font-weight:500;padding:5px 10px;font-size:11px;box-shadow:none}
  .g2{display:grid;grid-template-columns:1fr 150px;gap:10px}
  .g3{display:grid;grid-template-columns:1fr 130px 140px 90px;gap:10px;align-items:end}
  @media(max-width:680px){.g2,.g3{grid-template-columns:1fr}}
  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv:last-child{border-bottom:0}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:6px;border-bottom:1px solid var(--line)}
  td{padding:7px 6px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace}
  td.dim{color:var(--dim)}
  .err{color:var(--bad);font-size:12px;margin-top:8px}
  .note{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">SMSBomb <span class="mono">/ dashboard</span></div><nav><a href="/">← hub</a></nav></div></header>
<main class="wrap">
  <h1>Dashboard</h1>
  <p class="sub">Key banao, expiry dekho, kill karo. Sab local browser me rehta hai.</p>

  <div class="panel">
    <label>api key</label>
    <div class="g2"><input id="key" placeholder="sb_live_..." autocomplete="off"><button id="save">check</button></div>
    <div id="me" style="margin-top:14px"></div>
    <div class="err" id="e1"></div>
  </div>

  <h2>Admin</h2>
  <div class="panel">
    <label>admin secret</label>
    <div class="g2"><input id="sec" type="password" placeholder="ADMIN_SECRET" autocomplete="off"><button id="load">load</button></div>
    <div class="err" id="e2"></div>
  </div>

  <div class="panel">
    <label>naya key</label>
    <div class="g3">
      <input id="name" placeholder="naam">
      <select id="plan">
        <option value="1h">1 hour</option>
        <option value="1d" selected>1 day</option>
        <option value="3d">3 days</option>
        <option value="1w">1 week</option>
        <option value="1m">1 month</option>
        <option value="1y">1 year</option>
      </select>
      <input id="daily" placeholder="daily" inputmode="numeric">
      <button id="mint">mint</button>
    </div>
    <div id="minted" class="mono" style="margin-top:10px;font-size:12px;word-break:break-all"></div>
    <div class="note" style="margin-top:8px">daily khaali chhodo to duration ka default lagega.</div>
  </div>

  <h2>Keys</h2>
  <div class="panel" style="overflow:auto"><div id="list" class="note">secret daalo, phir load</div></div>

  <h2>Health</h2>
  <div class="panel">
    <div class="g2"><input id="hnum" value="9876543210"><button id="hcheck" class="ghost">check</button></div>
    <div id="hout" class="mono" style="margin-top:12px;font-size:12px"></div>
  </div>
</main>
<script>
const $ = (i) => document.getElementById(i);
$('key').value = localStorage.getItem('sb_key') || '';
$('sec').value = localStorage.getItem('sb_sec') || '';

const left = (ts) => {
  if (!ts) return 'never';
  const d = ts - Date.now();
  if (d <= 0) return 'expired';
  const h = Math.floor(d / 36e5), m = Math.floor(d % 36e5 / 6e4);
  return h > 24 ? Math.floor(h/24) + 'd' : (h ? h + 'h ' : '') + m + 'm';
};

$('save').onclick = async () => {
  $('e1').textContent = '';
  const k = $('key').value.trim();
  localStorage.setItem('sb_key', k);
  const r = await fetch('/api/v1/me?key=' + encodeURIComponent(k));
  const j = await r.json();
  if (!j.ok) return $('e1').textContent = j.error;
  $('me').innerHTML = `
    <div class="kv"><span>plan</span><b>${j.plan}</b></div>
    <div class="kv"><span>bacha</span><b>${left(j.expires)}</b></div>
    <div class="kv"><span>aaj</span><b>${j.quota.used} / ${j.quota.limit}</b></div>
    <div class="kv"><span>total</span><b>${j.quota.total}</b></div>`;
};

$('load').onclick = async () => {
  $('e2').textContent = '';
  const s = $('sec').value.trim();
  localStorage.setItem('sb_sec', s);
  const r = await fetch('/api/admin/keys?secret=' + encodeURIComponent(s));
  const j = await r.json();
  if (!j.ok) return $('e2').textContent = j.error;
  if (!j.keys.length) return $('list').textContent = 'koi key nahi';
  $('list').innerHTML = `<table><tr><th>name</th><th>key</th><th>plan</th><th>bacha</th><th>aaj/total</th><th></th></tr>
    ${j.keys.map(k => `<tr>
      <td>${k.name || '-'}</td>
      <td class="dim">${k.key.slice(0,12)}…</td>
      <td>${k.plan}</td>
      <td class="${left(k.expires)==='expired'?'dim':''}">${left(k.expires)}</td>
      <td class="dim">${k.total}</td>
      <td><button class="red" data-k="${k.key}">kill</button></td></tr>`).join('')}</table>`;
  $('list').querySelectorAll('button[data-k]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('revoke?')) return;
      await fetch(`/api/admin/keys?secret=${encodeURIComponent(s)}&key=${b.dataset.k}`, { method:'DELETE' });
      $('load').click();
    };
  });
};

$('mint').onclick = async () => {
  const s = $('sec').value.trim();
  const body = { plan: $('plan').value, name: $('name').value.trim() };
  const d = $('daily').value.trim();
  const r = await fetch('/api/admin/keys?secret=' + encodeURIComponent(s), {
    method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)
  });
  const j = await r.json();
  $('minted').textContent = j.ok ? `${j.key}  (${j.name||'-'} · ${j.label} · ${j.daily}/din)` : (j.error || 'fail');
  if (j.ok) { $('key').value = j.key; localStorage.setItem('sb_key', j.key); }
};

$('hcheck').onclick = async () => {
  const s = $('sec').value.trim();
  $('hout').textContent = 'chal raha...';
  const r = await fetch(`/api/v1/health?secret=${encodeURIComponent(s)}&number=${$('hnum').value.trim()}`);
  const j = await r.json();
  $('hout').innerHTML = j.ok
    ? `<b>${j.passRate}</b> confirmed · ${JSON.stringify(j.summary)}<br><span class="note">${j.confirmed.join(', ')}</span>`
    : (j.error || 'fail');
};
</script>
</body>
</html>
